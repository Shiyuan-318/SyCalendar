<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyCalendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" title="菜单">☰</button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">📅 SyCalendar</div>
            <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="折叠侧边栏">◀</button>
        </div>

        <div class="view-switcher">
            <div class="view-switcher-label">视图</div>
            <button class="view-btn active" data-view="month">
                <span class="view-btn-icon">📆</span>
                <span class="view-btn-text">月视图</span>
            </button>
            <button class="view-btn" data-view="week">
                <span class="view-btn-icon">📋</span>
                <span class="view-btn-text">周视图</span>
            </button>
            <button class="view-btn" data-view="day">
                <span class="view-btn-icon">☀️</span>
                <span class="view-btn-text">日视图</span>
            </button>
            <button class="view-btn" data-view="year">
                <span class="view-btn-icon">🗓️</span>
                <span class="view-btn-text">年视图</span>
            </button>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-header">
                <span class="sidebar-section-title">今日日程</span>
                <button class="sidebar-add-btn" id="sidebarAddEvent" title="添加日程">+</button>
            </div>
            <div class="sidebar-events-list" id="sidebarEventsList">
                <div class="sidebar-empty">暂无日程</div>
            </div>
        </div>

        <div class="sidebar-section" style="margin-top: auto;">
            <button class="btn btn-export" id="exportBtn" style="width:100%">
                📥 导出日程 (ICS)
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="big-date-display" id="bigDateDisplay">
            <div class="big-day" id="bigDay">8</div>
            <div class="big-date-info" id="bigDateInfo"></div>
            <div class="big-date-lunar" id="bigDateLunar"></div>
        </div>

        <div class="calendar-card" id="calendarCard"></div>
    </main>

    <!-- Event Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal">
            <div class="modal-title" id="modalTitle">添加日程</div>
            <div class="form-group">
                <label class="form-label">日程标题</label>
                <input type="text" class="form-input" id="eventTitle" placeholder="输入日程标题">
            </div>
            <div class="form-group">
                <label class="form-label">日期</label>
                <input type="date" class="form-input" id="eventDate">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">开始时间</label>
                    <input type="time" class="form-input" id="eventStartTime" value="09:00">
                </div>
                <div class="form-group">
                    <label class="form-label">结束时间</label>
                    <input type="time" class="form-input" id="eventEndTime" value="10:00">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">提醒时间</label>
                <select class="form-input" id="eventReminder">
                    <option value="0">不提醒</option>
                    <option value="5">提前 5 分钟</option>
                    <option value="15">提前 15 分钟</option>
                    <option value="30">提前 30 分钟</option>
                    <option value="60">提前 1 小时</option>
                    <option value="1440">提前 1 天</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">备注</label>
                <textarea class="form-input" id="eventNotes" placeholder="添加备注信息..."></textarea>
            </div>
            <input type="hidden" id="eventId">
            <div class="form-actions">
                <button class="btn btn-secondary" id="modalCancel">取消</button>
                <button class="btn btn-danger" id="modalDelete" style="display:none;">删除</button>
                <button class="btn btn-primary" id="modalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
